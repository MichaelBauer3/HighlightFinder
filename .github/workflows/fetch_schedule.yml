name: Fetch Game Schedule

on:
  # Run every Monday at Midnight
  schedule:
    - cron: '0 0 * * 1'
      timezone: "America/New_York"

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug

jobs:
  fetch-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] https://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies
        run: |
          pip install selenium requests webdriver-manager

      - name: Fetch schedule from website
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PYTHONPATH: src
        run: |
          python scripts/get_schedule.py

      - name: Display schedule
        run: |
          echo "Schedule fetched successfully!"
          echo ""
          cat data/metadata/schedule_cache.json

      - name: Commit schedule to repository
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data/metadata/schedule_cache.json
          
          if ! git diff --staged --quiet; then
            git commit -m "Update game schedule - $(date +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Schedule updated and pushed to repository"
          else
            echo "No changes to schedule"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "================================"
          echo "SCHEDULE FETCH COMPLETE"
          echo "================================"
          
          if [ -f data/metadata/schedule_cache.json ]; then
            GAME_COUNT=$(jq '.game_count // 0' data/metadata/schedule_cache.json)
            STATUS=$(jq -r '.status // "unknown"' data/metadata/schedule_cache.json)
            UPDATED=$(jq -r '.updated_at // "unknown"' data/metadata/schedule_cache.json)
            
            echo "Status: $STATUS"
            echo "Games found: $GAME_COUNT"
            echo "Updated at: $UPDATED"
            
            if [ "$STATUS" = "success" ] && [ "$GAME_COUNT" -gt 0 ]; then
              echo ""
              echo "Game details:"
              jq -r '.games[] | "  - \(.team) vs \(.opponent): \(.date) at \(.time) (\(.field))"' data/metadata/schedule_cache.json
            fi
          else
            echo "data/metadata/schedule_cache.json not found"
          fi
          
          echo "================================"